<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c2742">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Hexling">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hexling</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c2742; font-family: system-ui, sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  canvas { display: block; }
  img.ico { vertical-align: middle; image-rendering: auto; }
  :root { --ad-h: 0px; }
  #ad-slot { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: var(--ad-h); background: #120c26; color: #8a84a0; font: 600 12px system-ui; align-items: center; justify-content: center; z-index: 4; border-top: 1px solid rgba(255,255,255,.1); }
  #bar { position: fixed; left: 0; right: 0; bottom: var(--ad-h); display: flex; gap: 6px; padding: 8px 10px max(8px, env(safe-area-inset-bottom)); justify-content: center; align-items: stretch; background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  #bar button { flex: 1; max-width: 76px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px 4px; background: rgba(40,24,86,.88); border: 1px solid rgba(190,160,255,.35); border-radius: 14px; font-size: 10px; font-weight: 600; color: #e9e1ff; }
  #bar button img { width: 34px; height: 34px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #bar button:active { transform: scale(.94); }
  /* geliştirme ipucu: oyunu kesmez, dokunmayı engellemez */
  #bar button { position: relative; }
  #bar button.hint { border-color: #ffe36b; animation: hintGlow 1.1s ease-in-out infinite; }
  #bar button.hint img { animation: hintBounce .9s ease-in-out infinite; }
  #hint-tip { position: fixed; z-index: 5; pointer-events: none; display: none; transform: translateX(-50%); color: #2a1a00; background: #ffe36b;
    font-weight: 800; font-size: 12px; padding: 4px 9px; border-radius: 10px; white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.45);
    animation: tipBob .9s ease-in-out infinite; }
  #hint-tip::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: #ffe36b; border-bottom: 0; }
  @keyframes hintGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,227,107,0); } 50% { box-shadow: 0 0 14px 3px rgba(255,227,107,.85); } }
  @keyframes hintBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px) scale(1.08); } }
  @keyframes tipBob { 0%,100% { margin-top: 0; } 50% { margin-top: -6px; } }
  #essence-wrap { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,.55); color: #9be7ff; padding: 4px 12px 4px 6px; border-radius: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  #archer-btn { display: none; position: fixed; right: 12px; bottom: calc(112px + var(--ad-h)); width: 64px; height: 64px; border-radius: 50%; padding: 0; align-items: center; justify-content: center; font-size: 32px; background: rgba(36,26,64,.85); border: 2px solid rgba(255,255,255,.35); box-shadow: 0 4px 14px rgba(0,0,0,.5); z-index: 5; }
  #archer-btn.sel { background: #d9822b; border-color: #ffe36b; box-shadow: 0 0 18px #ffe36b; }
  #master-btn { display: none; position: fixed; left: 50%; bottom: calc(104px + var(--ad-h)); transform: translateX(-50%); align-items: center; gap: 8px; background: #2f8a8a; box-shadow: 0 4px 14px rgba(0,0,0,.5); padding: 10px 18px; font-size: 15px; }
  button { background: #5b34b3; color: #fff; border: 0; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; }
  button:disabled { background: #3a3350; color: #8a84a0; }
  button.danger { background: #7a2a3a; }
  button.x { background: #7a2a3a; padding: 6px 12px; }
  #panel { display: none; position: fixed; top: 5%; left: 50%; transform: translateX(-50%); width: min(540px, 95vw); max-height: 80vh; overflow-y: auto; background: rgba(18,14,34,.97); color: #eee; border-radius: 18px; padding: 12px 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #panel .head { display: flex; justify-content: space-between; align-items: center; font-size: 18px; margin-bottom: 6px; }
  .banner { height: 104px; overflow: hidden; border-radius: 12px; margin: 2px 0 8px; background: #2a1d4a; }
  .banner img { width: 100%; height: 100%; object-fit: cover; animation: kb 16s ease-in-out infinite alternate; }
  .scene { width: 100%; border-radius: 10px; margin-bottom: 6px; animation: fadein .8s both; }
  #panel .row.page { display: block; }
  #panel .row.page .scene { display: block; margin-bottom: 8px; aspect-ratio: 16 / 9; object-fit: cover; }
  #panel .row.page small { display: block; margin-top: 4px; line-height: 1.5; font-size: 13px; }
  @keyframes kb { from { transform: scale(1) translateX(0); } to { transform: scale(1.14) translateX(-2.5%); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  /* hikâye ara sahnesi: görsel üstte (oranı korunarak sığar), yazı görselin ALTINDA; telefonda ve masaüstünde aynı düzen */
  .scene-ov { position: fixed; inset: 0; z-index: 250; background: linear-gradient(160deg, #1b1236, #3a1d5c 60%, #07040f); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); overflow-y: auto; animation: fadein .9s both; cursor: pointer; }
  .scene-ov.out { opacity: 0; transition: opacity .5s; }
  .scene-img { flex: 0 0 auto; width: min(100%, calc(58vh * 16 / 9), 1100px); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.6); background: #120c26; }
  .scene-img img { width: 100%; height: 100%; object-fit: cover; display: block; animation: kb 22s ease-in-out infinite alternate; }
  .scene-txt { flex: 0 0 auto; width: min(100%, 760px); padding: 4px 6px 20px; color: #fff; text-shadow: 0 2px 6px #000; text-align: left; }
  .scene-txt b { font-size: 21px; color: #ffe9a0; }
  .scene-txt p { margin: 8px 0 12px; font-size: 16px; line-height: 1.5; }
  .scene-txt small { opacity: .7; }
  #panel h3 { margin: 14px 0 4px; color: #b79bff; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .row small { color: #a9a3c2; }
  .rtxt { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rtxt > div { min-width: 0; }
  .rar { display: inline-flex; border: 2px solid; border-radius: 10px; padding: 2px; background: rgba(255,255,255,.05); }
  .on { color: #7bff9a; font-weight: 700; }
  .row button { min-width: 64px; }
  .btns { display: flex; flex-direction: column; gap: 4px; }
  .btns button { font-size: 12px; padding: 6px 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding-top: 6px; }
  .card { background: #241a45; border: 1px solid rgba(190,160,255,.35); border-radius: 12px; overflow: hidden; text-align: center; }
  .card > img { width: 100%; display: block; aspect-ratio: 5/7; object-fit: cover; background: #120c26; }
  .cinfo img { width: 14px; height: 14px; vertical-align: -2px; display: inline-block; }
  .card.unknown > img { filter: brightness(0) contrast(0.6); opacity: .7; }
  .cname { font-weight: 700; padding: 6px 4px 0; font-size: 13px; }
  .cinfo { color: #b9b1d6; font-size: 11px; padding: 2px 4px 8px; }
  #mini { display: none; position: fixed; inset: 0; background: rgba(4,8,20,.9); align-items: center; justify-content: center; z-index: 20; touch-action: manipulation; }
  .mbox { background: #1a1238; border: 1px solid rgba(190,160,255,.45); border-radius: 18px; padding: 16px 18px 20px; width: min(360px, 92vw); text-align: center; color: #eee; }
  .mbox h3 { margin: 0 0 6px; color: #d8c8ff; text-transform: none; letter-spacing: 0; font-size: 18px; }
  .big { font-size: 38px; font-weight: 800; color: #ffe36b; min-height: 44px; margin: 6px 0; }
  .big-btn { font-size: 20px; padding: 14px 40px; margin-top: 6px; background: #d9822b; }
  .bar { position: relative; height: 34px; margin: 14px 4px; background: #2a2150; border-radius: 17px; overflow: hidden; }
  .zone { position: absolute; left: 41%; width: 18%; top: 0; bottom: 0; background: rgba(123,255,154,.55); }
  .mark { position: absolute; top: 3px; bottom: 3px; width: 8px; margin-left: -4px; background: #fff; border-radius: 4px; box-shadow: 0 0 8px #fff; }
  .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 4px; }
  .pad { height: 96px; border-radius: 16px; opacity: .55; transition: opacity .1s, transform .1s; }
  .pad.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 22px #fff; }
  .field { position: relative; height: 280px; margin-top: 8px; background: #120c2a; border-radius: 14px; overflow: hidden; touch-action: none; }
  .star { position: absolute; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #btn-settings { position: fixed; left: 10px; top: 112px; width: 42px; height: 42px; padding: 4px; border-radius: 21px; background: rgba(40,24,86,.8); border: 1px solid rgba(190,160,255,.4); font-size: 22px; line-height: 1; }
  #btn-settings img { width: 32px; height: 32px; display: block; margin: 0 auto; }
  #btn-shop { position: fixed; left: 10px; top: 160px; width: 42px; height: 42px; padding: 4px; border-radius: 21px; background: rgba(120,70,10,.85); border: 1px solid rgba(255,210,120,.6); font-size: 22px; line-height: 1; }
  #btn-shop img { width: 30px; height: 30px; display: block; margin: 0 auto; }
  #quest { position: fixed; left: 60px; top: 112px; max-width: 158px; z-index: 5; display: none; padding: 5px 10px; border-radius: 10px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,230,160,.45); color: #ffe9a0; font-size: 12px; font-weight: 700; line-height: 1.3; cursor: pointer; }
  #btn-house { position: fixed; left: 10px; top: 208px; width: 42px; height: 42px; padding: 4px; border-radius: 21px; background: rgba(90,40,110,.85); border: 1px solid rgba(255,170,240,.6); font-size: 22px; line-height: 1; }
  #btn-house[data-badge="1"]::after { content: ''; position: absolute; right: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #ff4d4d; border: 2px solid #fff; }
  /* açılış ekranı */
  #landing { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: space-between; color: #fff; overflow: hidden; touch-action: manipulation; }
  #landing.hidden { display: none; }
  .l-bg { position: absolute; inset: 0; background: #1a1240 url(assets/title_bg.jpg) center/cover no-repeat; animation: lzoom 24s ease-in-out infinite alternate; }
  .l-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(10,6,30,.55) 0%, rgba(10,6,30,0) 26%, rgba(10,6,30,0) 52%, rgba(10,6,30,.88) 100%); }
  @keyframes lzoom { from { transform: scale(1); } to { transform: scale(1.08); } }
  .l-bgblur { display: none; position: absolute; inset: -6%; background: #1a1240 url(assets/title_bg.jpg) center/cover no-repeat; filter: blur(26px) brightness(.5); }
  /* yatay ekran (masaüstü/tablet): dikey kapak görseli kırpılıp yüzü logonun altında kalmasın; ortada tam gösterilir, yanlar bulanık dolgu */
  @media (min-aspect-ratio: 1/1) {
    .l-bgblur { display: block; }
    .l-bg { background-size: contain; background-color: transparent; animation: none; }
  }
  .l-top { position: relative; text-align: center; padding: max(26px, env(safe-area-inset-top)) 16px 0; }
  #l-logo { width: min(80vw, 400px, 62vh); filter: drop-shadow(0 6px 14px rgba(0,0,0,.65)); animation: lfloat 4s ease-in-out infinite; }
  #l-logo-txt { display: none; font-size: 54px; font-weight: 900; letter-spacing: .12em; color: #ffe36b; text-shadow: 0 4px 0 #5b34b3, 0 8px 18px rgba(0,0,0,.7); }
  .l-sub { margin-top: 2px; font-size: 18px; font-weight: 800; letter-spacing: .5em; color: #e9dcff; text-shadow: 0 2px 8px rgba(0,0,0,.8); text-transform: uppercase; }
  @keyframes lfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .l-bottom { position: relative; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 0 22px max(18px, env(safe-area-inset-bottom)); }
  #l-save { font-size: 13px; color: #e0d4ff; text-shadow: 0 1px 6px #000; min-height: 18px; }
  #l-name { width: min(280px, 80vw); text-align: center; font-size: 17px; font-weight: 700; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.35); background: rgba(10,6,30,.65); color: #fff; user-select: text; -webkit-user-select: text; }
  .l-btn { width: min(280px, 80vw); padding: 13px 16px; font-size: 17px; border-radius: 14px; background: rgba(60,36,130,.9); border: 1px solid rgba(190,160,255,.5); box-shadow: 0 4px 14px rgba(0,0,0,.45); }
  .l-btn.primary { background: linear-gradient(#ffb347, #e07a1f); color: #2a1200; border-color: #ffd98a; font-weight: 800; font-size: 19px; }
  .l-row { display: flex; gap: 8px; width: min(280px, 80vw); }
  .l-btn.small { flex: 1; width: auto; padding: 9px 6px; font-size: 13px; }
  #l-help { font-size: 12px; color: #d6caf5; text-align: center; max-width: 320px; text-shadow: 0 1px 6px #000; }
  #l-ver { font-size: 11px; color: #b9aee0; text-shadow: 0 1px 4px #000; }
  .hof-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .hof-rank { font-weight: 800; color: #ffe36b; text-align: center; }
  .hof-row small { color: #a9a3c2; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .set-row input[type=range] { flex: 1; max-width: 220px; accent-color: #ffb347; }
  .seg { display: flex; gap: 6px; }
  .seg button { padding: 8px 14px; background: #3a3350; }
  .seg button.sel { background: #d9822b; color: #2a1200; }
  @media (max-width: 520px) {
    #bar { gap: 4px; padding: 6px 5px max(6px, env(safe-area-inset-bottom)); }
    #bar button img { width: 30px; height: 30px; }
    #bar button { font-size: 9px; }
    #panel { top: 3%; max-height: 84vh; }
    #master-btn { bottom: 96px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="essence-wrap"><img class="ico" src="assets/ui_soul.png" width="26" height="26" alt="" onerror="this.outerHTML='✦'"> <span id="essence">0</span></div>
<div id="hint-tip" data-t>Buraya tıkla!</div>
<button id="btn-shop" title="Güç Paketleri"><img src="assets/ui_power.png" alt="" onerror="this.outerHTML='⚡'"></button>
<div id="quest"></div>
<button id="btn-house" title="Cadı Evi">🏠</button>
<button id="btn-settings" title="Ayarlar"><img src="assets/ui_settings.png" alt="" onerror="this.outerHTML='⚙'"></button>
<button id="archer-btn" title="Okçu (arbalet)">🏹</button>
<button id="master-btn"><img class="ico" src="assets/ui_skill.png" width="26" height="26" alt="" onerror="this.style.display='none'"> <span data-t>Usta Cadı: Eğitim</span></button>
<div id="ad-slot"></div>
<div id="bar">
  <button id="btn-tree"><img src="assets/ui_skill.png" alt="" onerror="this.style.display='none'"><span data-t>Yetenek</span></button>
  <button id="btn-weapons"><img src="assets/ui_spells.png" alt="" onerror="this.style.display='none'"><span data-t>Büyüler</span></button>
  <button id="btn-gear"><img src="assets/ui_gear.png" alt="" onerror="this.style.display='none'"><span data-t>Ekipman</span></button>
  <button id="btn-crystals"><img src="assets/ui_crystal.png" alt="" onerror="this.style.display='none'"><span data-t>Kristal</span></button>
  <button id="btn-stats"><img src="assets/ui_stats.png" alt="" onerror="this.style.display='none'"><span data-t>Stat</span></button>
  <button id="btn-cards"><img src="assets/ui_cards.png" alt="" onerror="this.style.display='none'"><span data-t>Kartlar</span></button>
  <button id="btn-map"><img src="assets/ui_map.png" alt="" onerror="this.style.display='none'"><span data-t>Harita</span></button>
</div>
<div id="panel"></div>
<div id="mini"></div>
<div id="landing">
  <div class="l-bgblur"></div>
  <div class="l-bg"></div>
  <div class="l-top">
    <img id="l-logo" src="assets/logo_title.png" alt="HEXLING" onerror="this.style.display='none';document.getElementById('l-logo-txt').style.display='block'">
    <div id="l-logo-txt">HEXLING</div>
    <div class="l-sub"><span data-t>Kırk Ada</span></div>
  </div>
  <div class="l-bottom">
    <div id="l-save"></div>
    <input id="l-name" maxlength="16" autocomplete="off" spellcheck="false">
    <button id="l-continue" class="l-btn primary"><span data-t>Devam et</span></button>
    <button id="l-new" class="l-btn"><span data-t>Yeni oyun</span></button>
    <div class="l-row">
      <button id="l-settings" class="l-btn small"><img src="assets/ui_settings.png" width="20" height="20" alt="" onerror="this.style.display='none'"> <span data-t>Ayarlar</span></button>
      <button id="l-hof" class="l-btn small"><img src="assets/ui_stats.png" width="20" height="20" alt="" onerror="this.style.display='none'"> <span data-t>Şeref Salonu</span></button>
    </div>
    <div id="l-help" data-t>Hareket: ekrana basılı tutup sürükle. Büyüler kendiliğinden atılır.</div>
    <div id="l-ver"></div>
  </div>
</div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
