<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c2742">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/witch.png">
<title>Cadı Çırağı</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c2742; font-family: system-ui, sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  @media (max-width: 520px) {
    #bar { gap: 4px; padding: 8px 6px max(8px, env(safe-area-inset-bottom)); }
    #bar button { padding: 9px 2px; font-size: 11px; min-width: 0; }
    #panel { top: 3%; max-height: 82vh; }
    .row button { min-width: 64px; }
  }
  canvas { display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px 12px; justify-content: center; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  #bar button { flex: 1; max-width: 160px; padding: 10px 6px; font-size: 13px; }
  #essence-wrap { position: fixed; top: 12px; right: 12px; background: rgba(0,0,0,.55); color: #9be7ff; padding: 6px 12px; border-radius: 14px; font-weight: 700; }
  button { background: #5b34b3; color: #fff; border: 0; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; }
  button:disabled { background: #3a3350; color: #8a84a0; }
  button.danger { background: #7a2a3a; margin-top: 12px; width: 100%; }
  #panel { display: none; position: fixed; top: 6%; left: 50%; transform: translateX(-50%); width: min(520px, 94vw); max-height: 78vh; overflow-y: auto; background: rgba(18,14,34,.96); color: #eee; border-radius: 16px; padding: 12px 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #panel .head { display: flex; justify-content: space-between; align-items: center; font-size: 18px; margin-bottom: 6px; }
  #panel h3 { margin: 14px 0 4px; color: #b79bff; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .row small { color: #a9a3c2; }
  .row button { min-width: 84px; }
  .btns { display: flex; flex-direction: column; gap: 4px; }
  .btns button { font-size: 12px; padding: 6px 10px; }
  .btns button.danger { margin-top: 0; width: auto; }
  #essence-wrap { top: 12px; right: 12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="essence-wrap">✦ <span id="essence">0</span></div>
<div id="bar">
  <button id="btn-tree">Yetenek</button>
  <button id="btn-weapons">Büyüler</button>
  <button id="btn-gear">Ekipman</button>
  <button id="btn-crystals">Kristal</button>
  <button id="btn-stats">Stat</button>
  <button id="btn-zones">Harita</button>
</div>
<div id="panel"></div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
