name: Mobil derleme (Android + iOS)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build:www
      - run: npx cap add android
      - name: AdMob uygulama kimliği (yoksa test kimliği)
        env:
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
        run: python3 scripts/inject-ads.py android
      - run: npx @capacitor/assets generate --android --assetPath resources
      - run: npx cap sync android
      - name: APK derle (debug imzalı, doğrudan kurulabilir)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hexling-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hexling-android
          path: Hexling-android.apk

  ios:
    name: iOS (imzasız IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:www
      - run: npx cap add ios
      - name: AdMob uygulama kimliği (yoksa test kimliği)
        env:
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
        run: python3 scripts/inject-ads.py ios
      - run: npx @capacitor/assets generate --ios --assetPath resources
      - run: npx cap sync ios
      - name: Derle (imzasız)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Hexling-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Hexling-ios-unsigned
          path: Hexling-ios-unsigned.ipa

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" \
            --title "Hexling ${{ github.ref_name }}" \
            --notes "Android: Hexling-android.apk (doğrudan kurulur). iOS: Hexling-ios-unsigned.ipa (imzasız; Sideloadly/AltStore ile kendi Apple kimliğinle imzalayıp kur)."
